aid: mealpal
name: MealPal
description: 'MealPal is a consumer meal subscription service that lets members reserve lunch or dinner
  from a rotating selection of local restaurants at a discounted, fixed membership price, ordering ahead
  through its iOS and Android apps to skip the line at pickup. The service is organized around its MealPass
  lunch/dinner subscription and MealFix offering, alongside a partner program that restaurants join to
  reach members. MealPal operates as a business-to-consumer mobile application and website and does not
  publish a public developer API, developer portal, or API documentation. This record was surfaced as a
  portfolio company of Bessemer Venture Partners and Menlo Ventures and is tracked in the API Evangelist
  network.'
